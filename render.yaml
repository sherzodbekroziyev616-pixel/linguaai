services:
  - type: web
    name: linguaai
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: linguaai-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        value: https://linguaai.onrender.com
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: linguaai-db
    plan: basic-256mb
    databaseName: linguaai
    user: linguaai
